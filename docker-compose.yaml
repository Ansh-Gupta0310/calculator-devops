services:

  calculator:
    # Image produced by Jenkins (build from here)
    image: ${DOCKER_IMAGE:-anshgupta0310/calculator-devops:latest}
    container_name: calculator
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms128m -Xmx384m
    networks:
      - calc-net
    expose:
      - "8080"        # nginx reaches this
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: calc-nginx
    depends_on:
      calculator:
        condition: service_healthy
    ports:
      - "80:80"       # public entry point
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calc-net
    restart: unless-stopped

networks:
  calc-net:
    driver: bridge

