# defines group of backend servers that Nginx can send requests to
upstream calc_backend{
    server calculator:8080;
}

server{
    # tells Nginx to listen for HTTP requests on port 80
    listen 80 default_server;

    # specifies which host names a server block should match (_ denotes the default server)
    server_name _;

    # Pass the api through
    location /api/ {
        proxy_pass http://calc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pass the health endpoint through
    location /actuator/ {
        proxy_pass http://calc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Landing page
    location / {
        default_type text/html;

        return 200 '<h1>Calculator DevOps</h1><p>Try <a href="/api/v1/add?a=2&b=3">/api/v1/add?a=2&b=3</a></p>';
    }
}
